name: Auto Update Upstream

on:
  schedule:
    # 每天每 4 小时检查一次上游是否有新版本
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        run: |
          set -euo pipefail
          RELEASE=$(curl --fail --silent --show-error --location \
            "https://api.github.com/repos/GUI-for-Cores/GUI.for.SingBox/releases/latest")
          LATEST=$(jq -er '.tag_name | strings | select(startswith("v"))' <<< "${RELEASE}")
          LATEST="${LATEST#v}"
          CURRENT=$(grep -E '^pkgver=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'\"")

          echo "Current pkgver: ${CURRENT}"
          echo "Upstream latest: ${LATEST}"

          if [[ ! "${LATEST}" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Unexpected version format: ${LATEST}" >&2
            exit 1
          fi

          if [[ "${LATEST}" == "${CURRENT}" ]]; then
            echo "Already up to date."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSET="GUI.for.SingBox-linux-amd64.zip"
          jq -er --arg asset "${ASSET}" \
            '.assets[] | select(.name == $asset) | .browser_download_url' \
            <<< "${RELEASE}" >/dev/null || {
              echo "Error: Asset ${ASSET} not found in release v${LATEST}" >&2
              exit 1
            }

          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "latest_version=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD in Arch container
        if: steps.check.outputs.has_update == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest_version }}
        run: |
          sed -i -E "s/^pkgver=.*/pkgver=${LATEST}/" PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          docker run --rm \
            -v "${PWD}":/workspace \
            -w /workspace \
            archlinux:latest \
            bash -c "
              set -euo pipefail
              pacman -Syu --noconfirm pacman-contrib sudo
              useradd -m -s /bin/bash builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace
              su builder -c 'updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg --verifysource'
            "

      - name: Commit and push changes to GitHub
        if: steps.check.outputs.has_update == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "chore: bump version to ${LATEST}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Sync changes to AUR
        if: steps.check.outputs.has_update == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          LATEST: ${{ steps.check.outputs.latest_version }}
        run: |
          mkdir -p ~/.ssh
          echo "${AUR_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone ssh://aur@aur.archlinux.org/gui-for-singbox-bin.git /tmp/aur
          
          # 仅同步 AUR 打包必需文件，避免把 CI 配置或内部文档同步到 AUR
          cp PKGBUILD .SRCINFO gui-for-singbox* /tmp/aur/
          cd /tmp/aur
          git config user.name "m4rsquake"
          git config user.email "m4rsquake@outlook.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "update to ${LATEST}"
            git push origin master
          else
            echo "AUR is already up to date."
          fi
